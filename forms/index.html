<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <h1>Ejemplo Formularios</h1>
    <h2>Metodo Get</h2>
    <form action="/forms/index.html" method="get">
        <ul> 
            <li>
                <label for="Login">Usuario: </label>
                <input type="text" name="Login" placeholder="tu usuario de la aplicacion">
            </li>
            <li>
                <label for="pwd">Contraseña: </label>
                <input type="password" name="pwd" placeholder="tu Contraseña">
            </li>
            <li>
                <label for="mail">Email: </label>
                <input type="email" name="mail" placeholder="tu email">
            </li>
        </ul>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
    
    <h2>Metodo Post</h2>
    <form action="/forms/index.html" method="post">
        <ul> 
            <li>
                <label for="Login">Usuario: </label>
                <input type="text" name="Login" placeholder="tu usuario de la aplicacion">
            </li>
            <li>
                <label for="pwd">Contraseña: </label>
                <input type="password" name="pwd" placeholder="tu Contraseña">
            </li>
            <li>
                <label for="mail">Email: </label>
                <input type="email" name="mail" placeholder="tu email">
            </li>
        </ul>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
    
</body>
</html>
