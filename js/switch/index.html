<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
    <script>
        const value=0;

        function methodSwitch(val){
            let toRet;
            switch(val+1){
                case 1:
                    toRet=val+1;
                    break;
                case 2:
                    toRet=val+0;
                    break;
                case 3:
                    toRet=val-1;
                    break;
                default:
                    toRet=val*2
                    break;
            }
            return toRet;
        }
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <script>
        let result=methodSwitch(value);
        console.log("Value of switch case is -> "+ result);
    </script>
</body>
</html>
