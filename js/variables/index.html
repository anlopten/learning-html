<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <script>
        hours=2.5;
        month=10;
        name="Ramiro";
        let year=2026;
        let river= "Miño";
        const PI = 3.14159;
        // LAS CONSTANTES NUNCA SE MODIFICAN
        console.log(hours);
        console.log(month);
        console.log(name);
        console.log(year);
        console.log(river);
        console.log(PI);
        //Cambiando el valor de las variables
        hours=12.5;
        month=1;
        name="Pepe";
        year=2022;
        river= "Tajo";
        // CON VAR SOLO DECLARAMOS 
        var city="Madrid";
        console.log(city);
    </script>
</head>
