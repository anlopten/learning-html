<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de selección IF-ELSE</title>
    <script>
        const value=10
        function functionIf(val){
            if (val>5){
            console.log("1. - Greater or equal than 5");
        }
        }
        function functionElse(val){
            if (val>=6){
            console.log("2. - Greater or equal than 5");
            }
            else{
                console.log("2. -Less than 5");
            }
        }

        functionIfElseIf(val){
            if(val>=10) {
                console.log("3.- Greater or equal than 10");
            } else if(val<=5){
                console.log("3. -Less or equal than 5");
            } else{
                console.log("3. - Greater than 5");
            }
        }


    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <script>
        functionIf(value);
        functionIfElseIf(value);
        functionElse(value);
    </script>
    
</body>
</html>
