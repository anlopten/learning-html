<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores aritméticos</title>
    <script>
        let a=10;
        let b=5;
        console.log(a+b); //suma
        console.log(a-b); //resta
        console.log(a*b); //multiplicacion
        console.log(a/b); //division
        console.log(a%b); //mod
        console.log(a**b); //exponente
        console.log(++a); //incremento -> imprime
        console.log(--a); //decremento -> imprime
        console.log(a++); //incremento <- imprime
        console.log(a--); //decremento <- imprime
        a=12;
        //Para escribir por la consola:
        console.log("El valor de a es: ", a);
        console.log("El valor de b es: ",b);
        //Para hacer operaciones en consola.log, debe ir entre ()
        console.log("La suma de a y b es: ", (a+b));
        console.log("el 10mod5 es: ", (10%5));
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
</body>
</html>
