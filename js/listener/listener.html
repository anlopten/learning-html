<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listeners de eventos</title>
    <script>
        // !!!!!!! () => {} ---- FUNCION ANONIMA DE LINEA
        function addEventHandler(btn){
            let buttons = document.getElementsByClassName("enableBtn");
            console.log(buttons);
            for(let element of buttons){
                element.addEventListener("click",(btn) => {
                    // console.log("Botón pulsado", element)
                    console.log("Botón pulsado", btn.target.textContent)
                })
            }
            btn.remove()
        }
        // (btn) => {
        //     btn.target.textContent
        // }
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <button id="addFunc" onclick="addEventHandler(this)">
        Añadir funcionamiento
    </button>
    <button class="enableBtn">Funcionará...1</button>
    <button class="enableBtn">Funcionará...2</button>
    <button class="enableBtn">Funcionará...3</button>
    <button class="enableBtn">Funcionará...4</button>
    <button class="enableBtn">Funcionará...5</button>
    <script>
        
    </script>

</body>
</html>
