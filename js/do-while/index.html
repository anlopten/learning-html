<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucle Do-While</title>
    <script>
        function functionDoWhile(val){
            let i=0;
            do{
                console.log("Do-While Iteration " +i);
                i++;}
                while(i<=val);
        }
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <script>
        functionDoWhile(5);
    </script>

</body>
</html>
