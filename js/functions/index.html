    <title>Funciones</title>
    <script>
        function suma(a, b){ 
           return a+b;
        }
        multiply=function(a, b){
            console.log(a*b);
            return a*b;
        }
        function resta_f(a, b){ 
           console.log("El valor de la resta es: " + a-b);
        }
        function resta_nf(a, b){ 
           console.log("El valor de la resta es: " + (a-b));
        }
    </script>
</head>

    <nav><a href="./.."> Volver atras</a></nav>

        res = suma(5,13);
        console.log("El resultado es: "+ res);
        res_mult=multiply(5,5);
        console.log("El resultado es: "+ res_mult);
        res_mult=multiply(5,5);
        console.log("El resultado es: "+ res_mult)
        resta_nf(8,5);
        resta_f(8,5);
    </script>
