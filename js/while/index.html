<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucle While</title>
    <script>
        function functionWhile(val){
            let i=0;
            while(i<val){
                console.log("While Iteration " +i);
                i++;
            }
        }        
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <script>
        functionWhile(5);
    </script>
</body>
</html>
