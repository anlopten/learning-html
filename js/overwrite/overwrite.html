<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herencia</title>
 <script>
        class Vehicle{
           constructor(brand){
            this.brand=brand;
           }
           start(){
            console.log(this.brand + " is starting");
           }
        }
        class Car extends Vehicle {
            constructor(brand, model) {
                super(brand);
                this.model=model
            }
            start(){
                console.log(this.model + " is starting")
            }
            getDesc(){
                console.log(this.brand + " is ready");
            }
        }
        const myCar = new Car ("Toyota", "Corolla");
        myCar.start()
        
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
   <script>
        let v=new Vehicle("Ford");
        v.start();
        let c=new Vehicle("Toyota", "Awensis");
        c.start()
        c.getDesc();
   </script>
</body>
</html>
