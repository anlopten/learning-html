<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucle For</title>
    <script>
        function functionFor(val){
            for(let i=0; i<val; i++){
                console.log("Iteration " +i);
            }
        }
    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <script>
        functionFor(5);
    </script>

</body>
</html>
