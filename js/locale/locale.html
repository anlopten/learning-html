<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locale</title>
    <script>
        const date = new Date();

    </script>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <script>
        console.log(date);
        console.log(date.toLocaleDateString());   
        console.log(date.toISOString());     //Momento UTC en el que estoy
        console.log(date.toLocaleDateString("es-ES"));  //Locale de paises concretos
        console.log(date.toLocaleDateString("en-US"));
        console.log(date.toLocaleTimeString("en-US"));
        console.log(date.toLocaleDateString("ar-EG"));
        console.log(date.getTime()); // epoch time (tiempo en mlseg desde 1/1/1970), se puede revisar en https://espanol.epochconverter.com/
    </script>

</body>
</html>
