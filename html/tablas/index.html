<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <nav><a href="./.."> Volver atras</a></nav>
    <h1>Ejemplo de Tabla</h1>
    <h2>Tabla simple</h2>
    <table border="1">
        <caption>Titulo de la tabla simple</caption>
        <tr>
            <th>Encabezado 1</th>
            <th>Encabezado 2</th>
            <th>Encabezado 3</th>
        </tr>
        <tr>
            <td>Celda 1</td>
            <td>Celda 2</td>
            <td>Celda 3</td>
        </tr>
        <tr>
            <td>Celda 4</td>
            <td>Celda 5</td>
            <td>Celda 6</td>
        </tr>
        <tr>
            <td>Celda 7</td>
            <td>Celda 8</td>
            <td>Celda 9</td>
        </tr>        
    </table>
    <h2>Tabla Combinada</h2>
    <table border="1">
        <caption>Titulo de tabla combinada</caption>
        <tr>
            <th colspan="2">Encabezado 1</th>
            <th rowspan="2">Encabezado 3</th>
        </tr>
        <tr>
            <td>Celda 1</td>
            <td>Celda 2</td>
            
        </tr>
        <tr>
            <td colspan="2" rowspan="2">Celda 4</td>
            <td>Celda 5</td>
            
        </tr>
        <tr>
            <td>Celda 7</td>
 
        </tr>        
    </table>
    
</body>
</html>
