<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Hand:wght@400..700&display=swap" rel="stylesheet">
    <!-- // Link a estilos CSS -->
    <link rel="stylesheet" href="./styles.css">
    <script>
         function addTask(){
            let input = document.getElementById("input-id");
            console.log(input.value)
            let liList = document.createElement("li");
            console.log(liList);
            liList.textContent = input.value;
            //let buttonVar = document.createElement("button"); //añade un boton a cada elemento de la lista
            // buttonVar.innerText="Borrar";
            // buttonVar.addEventListener("click", (btn) => { 
            //   //  console.log(btn.target.parentNode); imprime el parentNode (li)
            //   btn.target.parentNode.remove();
            // })
           
            document.getElementById("lista-tareas").appendChild(liList);
            // document.getElementById("task").appendChild(liVar); //Añade a la lista
            input.value = ""; //en la box de input hace que salga vacia
        }
    </script>
</head>
<body>
    <!-- // Añadimos un contenedor que contenga la app web -->
    <div class="container">
        <!-- CABECERA -->
        <header class="cab">
            <span class="icono-lista">📝</span>
            <h1>Mi lista de tareas</h1>
        </header>
        <!-- AGREGAR A LA LISTA -->
        <div class="input-container"> 
            <input type="text" id="input-id" placeholder="Escribe tu nueva tarea" autocomplete="off">
            <button class="btn-submit" onclick="addTask()"> <span>+</span>Agregar</button>
        </div>
        <!-- LISTA -->
        <ul class="task-list" id="lista-tareas"> 
            <!-- <li class="task-item">
                <div class="task-container">
                    <button class="btn-check">✓</button>
                    <span class="task-name">Tarea pendiente</span>
                </div>
                    <button class="btn-delete">🗑️</button>
            </li> -->
        </ul>
    </div>
    <script src="app.js"> </script>
</body>
</html>
