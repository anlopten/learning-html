<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <!-- // Link a estilos CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- // Añadimos un contenedor que contenga la app web -->
    <div class="container">
        <!-- CABECERA -->
        <header class="cab">
            <span>📝</span>
            <h1>Mi lista de tareas</h1>
        </header>
        <!-- AGREGAR A LA LISTA -->
        <div class="input-container"> 
            <input type="text" id="input-id" placeholder="Escribe tu nueva tarea" autocomplete="off">
            <button class="btn-submit"> <span>+</span>Agregar</button>
        </div>
        <!-- LISTA -->
        <ul class="task-list"> 
            <li class="task-item">
                <div class="task-container">
                    <button class="btn-check">✓</button>
                    <span class="task-name">Tarea pendiente</span>
                </div>
                    <butto class="btn-delete">🗑️</button>

            </li>
        </ul>
    </div>
    <script src="app.js"> </script>
</body>
</html>
