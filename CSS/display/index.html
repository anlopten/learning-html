<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización</title>
    <style>
        div{
            border: 1px solid black;
        }
         .container{
            padding: 8px 8px 0px 8px;
            width: 152px;
            margin-bottom: 16px;
        }
        .child{
            width: 150px;
            height: 100px;
            margin-bottom: 8px;
        }
        .d2{
            display: none;
        }
        .d5{
            visibility: hidden;
        }
       
    </style>
</head>
<body>
    <nav><a href="../index.html">Volver atras</a></nav>
    <h1>Display</h1>
    <div class="container">
        <div class="child d1">1</div>
        <div class="child d2">2</div>
        <div class="child d3">3</div>
    </div>
    <h1>Visibility</h1>
    <div class="container">
        <div class="child d4">4</div>
        <div class="child d5">5</div>
        <div class="child d6">6</div>
    </div>
</body>
</html>
