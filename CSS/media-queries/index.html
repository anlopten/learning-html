<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        h1{
            color:darkslateblue;
        }
        @media screen and (min-width: 700px) {
            h1{
                color: indianred;
            }
        }
        @media screen and (min-width: 900px) {
            h1{
                color: #257541;
            }
        }
        @media print {
            h1{
                color: #593617;
            }
        }
    </style>
</head>
<body>
    <nav><a href="../index.html">Volver atras</a></nav>
    <h1>Soy una Media Query</h1>
</body>
</html>
